[package]
name = "mihomo-server-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0-only"
publish = false
description = "Desktop window and tray for the local mihomo-server instance"

# Own workspace root; the patched ksni copy under vendor/ stays outside it.
[workspace]
exclude = ["vendor"]

[build-dependencies]
tauri-build = { version = "2.7.1", default-features = false , features = [] }

[dependencies]
# Shared management API client, pinned to a mihomo-server release tag.
management-client = { git = "https://github.com/oodzchen/mihomo-server", tag = "v0.2.20", features = ["events"] }
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.2"
anyhow = "1.0.104"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
# Already used by the single-instance plugin; sends failure notifications.
zbus = "5.9"
# Selects tray-icon's D-Bus StatusNotifierItem backend for Tauri's tray: unlike
# libappindicator it reports left clicks (Activate) and shows tooltips.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
# Hands KDE's XDG activation token for a tray click to GDK (see vendor/ksni),
# so KWin raises the window instead of only flagging it in the taskbar.
ksni = { version = "0.3.6", default-features = false }
gtk = "0.18"
gdkwayland-sys = "0.18"

[patch.crates-io]
ksni = { path = "vendor/ksni" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
